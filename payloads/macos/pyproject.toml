[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-vault"
version = "0.1.0"
description = "Safe AI maintenance for a personal Obsidian vault"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knowledge-vault = "knowledge_vault.cli:main"

[tool.setuptools]
package-dir = {"" = "程序"}

[tool.setuptools.packages.find]
where = ["程序"]
