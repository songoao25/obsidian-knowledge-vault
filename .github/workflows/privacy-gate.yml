name: privacy-gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: 隐私泄漏扫描（名称 + 内容 + zip 内部）
        run: |
          python3 tools/scan_privacy.py --root . --scope public --md scan-report.md
          echo "扫描通过：未发现敏感标记。"
